name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-public/**"
      - "mkdocs.yml"
      - "mcpobs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Same install list as check.yml's "Documentation builds" step --
      # mkdocstrings imports mcpobs directly, and mcpobs's own deps live in
      # requirements-dev.txt alongside every other package's, per that
      # workflow's own note on why the deps are split the way they are.
      - name: Install
        run: |
          pip install -r requirements-dev.txt -r requirements-check.txt -r normalizer/requirements.txt -r ingest/requirements.txt -r query/requirements.txt -r archiver/requirements.txt

      # --strict: a broken internal link or missing nav target fails the
      # build rather than shipping a 404. tests/test_docs.py (run in check.yml)
      # separately proves no internal engineering document reaches this
      # output -- this workflow only ever uploads mkdocs's own site_dir, never
      # the repository, so that boundary holds here too.
      - name: Build
        run: python -m mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
