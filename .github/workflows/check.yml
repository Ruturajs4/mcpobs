name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt -r requirements-check.txt

      # Unit tests need no stack: the OTLP fixture in tests/fixtures is a real
      # captured Kafka message, so decode/normalize/taxonomy are exercised
      # against genuine SDK output rather than a synthetic sample.
      - name: Tests
        run: pytest

      - name: Lint
        run: ruff check normalizer/ mcpobs/ query/ control/ ingest/ archiver/ tests/ scripts/ demo_server/

      - name: Typecheck
        run: mypy normalizer/ mcpobs/ query/ control/ ingest/ archiver/

      - name: Browser JavaScript syntax
        run: node --check query/static/app.js && node --check query/static/admin.js

      # --strict fails on a broken internal link, so a 404 cannot ship to a
      # customer. tests/test_docs.py separately greps the built output to
      # prove no internal engineering document was published.
      - name: Documentation builds
        run: python -m mkdocs build --strict

      # Browser flows need the stack, so they are not in the unit job. They
      # SKIP when the console is unreachable -- and the skip names the
      # reason, because a guard that reports green while testing nothing is
      # worse than no guard.
      - name: Browser flows
        run: |
          python -m playwright install --with-deps chromium
          pytest tests/test_browser_flows.py -v -rs

      # This is the tripwire that matters. The failure classifier matches
      # SDK-generated message prefixes; an SDK release that changes them would
      # otherwise silently degrade every customer's error intelligence. Failing
      # the build is the point.
      - name: SDK contract
        run: pytest tests/test_sdk_contract.py -v
