# Local slice. Same SHAPE as production (Architecture.md §3), one rung down
# the environment ladder (§10): single broker, RF=1, no replication.
#
# Auth, tenancy and the archive are NO LONGER absent from this rung. Postgres
# and MinIO run here because the local rung's job is to run the real engines
# (D40) -- a stubbed object store or a hard-coded tenant would push every bug
# in credentials, key layout and isolation into staging to be found there.
name: mcp-observability

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mcpobs-clickhouse
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_DB: mcpobs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # No /docker-entrypoint-initdb.d mount: it only runs against an empty data
    # directory, so new schema files silently never applied. The normalizer runs
    # MigrationRunner at startup instead -- one mechanism, idempotent, recorded.
    volumes:
      # Embedded Keeper so the LOCAL engine matches production. Without it
      # insert_deduplication_token is inert and ADR-006 goes untested.
      #
      # Mount the FILE, not the directory. Mounting ./clickhouse/config.d over
      # /etc/clickhouse-server/config.d shadows the image's own
      # docker_related_config.xml, which is what sets `listen_host` -- so the
      # server silently binds to 127.0.0.1 only and every in-network client gets
      # "connection refused" while `docker exec` still works.
      - ./clickhouse/config.d/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      # Generous: embedded Keeper runs a Raft election before the server accepts
      # connections, which takes appreciably longer than a bare MergeTree boot.
      retries: 60
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    container_name: mcpobs-kafka
    # Dual listener: containers reach the broker at kafka:9092, the host at
    # localhost:29092. With only the internal listener, a host client connects
    # but then gets metadata advertising `kafka:9092`, which it cannot resolve --
    # a confusing failure that looks like a network problem.
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Without this the image writes its log dir under /tmp, so the named
      # volume below is silently ignored and every container recreate loses all
      # topics and data. Found the hard way on Day 1.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are a contract (Architecture.md §6). Auto-created topics get
      # default partitions and no retention policy, then quietly become prod.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: mcpobs-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./kafka/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: mcpobs-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otel/config.yaml:ro
    # 4317/4318 are NOT published. The only way into the pipeline from the
    # host is the ingest gateway on 4319, which authenticates. Leaving the
    # Collector's OTLP ports exposed would leave an unauthenticated bypass
    # beside the front door -- and every byte of the auth work pointless,
    # because an attacker would simply use the other port.
    #
    # Container-to-container access still works: `ingest` reaches
    # otel-collector:4318 over the compose network.
    expose:
      - "4317"
      - "4318"
    ports:
      - "13133:13133" # health
      - "8889:8889"   # prometheus scrape: our own pipeline metrics
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  normalizer:
    build: ./normalizer
    container_name: mcpobs-normalizer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: otlp.spans.raw
      KAFKA_DLQ_TOPIC: otlp.spans.dlq
      KAFKA_GROUP_ID: normalizer
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: mcpobs
      BATCH_MAX_ROWS: "10000"
      BATCH_MAX_SECONDS: "5"
    depends_on:
      clickhouse: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mcpobs-postgres
    # 5433 on the host: 5432 is very often already taken by a locally
    # installed Postgres, and a port clash at `compose up` is a worse first
    # experience than a non-default number. Containers still use 5432.
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: mcpobs
      POSTGRES_PASSWORD: mcpobs
      POSTGRES_DB: mcpobs_control
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpobs -d mcpobs_control"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The S3 mock. MinIO speaks the real S3 API, so the archiver exercises real
  # credentials, real bucket semantics and real key layout -- the same reason
  # ClickHouse runs with embedded Keeper rather than plain MergeTree locally.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: mcpobs-minio
    command: server /data --console-address ":9001"
    ports: ["9002:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: mcpobs
      MINIO_ROOT_PASSWORD: mcpobs-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Quota counters. Named in the target architecture (section 3) for exactly
  # this -- shared state the ingest path reads on every request. An in-process
  # counter would meter ONE gateway replica, so a fleet of four would enforce
  # four times the limit; that difference should be visible locally rather than
  # discovered when the gateway first scales.
  redis:
    image: redis:7-alpine
    container_name: mcpobs-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Authenticates, stamps trusted tenant attributes, forwards to the Collector.
  # Customers point their exporter HERE; nothing else is publicly reachable.
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: mcpobs-ingest
    ports: ["4319:4319"]
    environment:
      CONTROL_PLANE_DSN: postgresql://mcpobs:mcpobs@postgres:5432/mcpobs_control
      COLLECTOR_ENDPOINT: http://otel-collector:4318/v1/traces
      DATA_REGION: local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }
    restart: unless-stopped

  archiver:
    build:
      context: .
      dockerfile: archiver/Dockerfile
    container_name: mcpobs-archiver
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: otlp.spans.raw
      KAFKA_GROUP_ID: archiver
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: mcpobs
      S3_SECRET_KEY: mcpobs-secret
      ARCHIVE_BUCKET: mcpobs-archive
      ARCHIVE_MAX_SECONDS: "10"
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    restart: unless-stopped

  query:
    build:
      context: .
      dockerfile: query/Dockerfile
    container_name: mcpobs-query
    ports: ["8080:8080"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: mcpobs
      CONTROL_PLANE_DSN: postgresql://mcpobs:mcpobs@postgres:5432/mcpobs_control
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  ch-data:
  kafka-data:
  pg-data:
  minio-data:
