[project]
name = "mcp-observability"
version = "0.1.0"
description = "MCP-native observability: OTel -> Collector -> Kafka -> normalizer -> ClickHouse"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "BLE"]
ignore = [
    "ANN401",  # Any is correct for OTLP attribute values
    "B008",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# `normalizer/` is production code and stays strict. The harness below is not:
# broad excepts are deliberate there (best-effort instrumentation and scenario
# driving must never take the process down over a secondary concern).
"tests/*" = ["ANN", "S101"]
"scripts/*" = ["ANN", "BLE001", "E501", "SIM105"]
"demo_server/*" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["\\.venv", "tests"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "clickhouse_connect.*", "opentelemetry.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
