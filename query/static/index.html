      <div class="grp">Capabilities</div>
      <a data-view="capabilities" data-kind="tool"><span class="ic"><svg viewBox="0 0 256 256"><path d="M226.76,69a8,8,0,0,0-12.84-2.88l-40.3,37.19-17.23-3.7-3.7-17.23,37.19-40.3A8,8,0,0,0,187,29.24,72,72,0,0,0,88,96,72.34,72.34,0,0,0,94,124.94L33.79,177c-.15.12-.29.26-.43.39a32,32,0,0,0,45.26,45.26c.13-.13.27-.28.39-.42L131.06,162A72,72,0,0,0,232,96,71.56,71.56,0,0,0,226.76,69ZM160,152a56.14,56.14,0,0,1-27.07-7,8,8,0,0,0-9.92,1.77L67.11,211.51a16,16,0,0,1-22.62-22.62L109.18,133a8,8,0,0,0,1.77-9.93,56,56,0,0,1,58.36-82.31l-31.2,33.81a8,8,0,0,0-1.94,7.1L141.83,108a8,8,0,0,0,6.14,6.14l26.35,5.66a8,8,0,0,0,7.1-1.94l33.81-31.2A56.06,56.06,0,0,1,160,152Z"/></svg></span> Tools</a>

      <a data-view="capabilities" data-kind="resource"><span class="ic"><svg viewBox="0 0 256 256"><path d="M245,110.64A16,16,0,0,0,232,104H216V88a16,16,0,0,0-16-16H130.67L102.94,51.2a16.14,16.14,0,0,0-9.6-3.2H40A16,16,0,0,0,24,64V208h0a8,8,0,0,0,8,8H211.1a8,8,0,0,0,7.59-5.47l28.49-85.47A16.05,16.05,0,0,0,245,110.64ZM93.34,64,123.2,86.4A8,8,0,0,0,128,88h72v16H69.77a16,16,0,0,0-15.18,10.94L40,158.7V64Zm112,136H43.1l26.67-80H232Z"/></svg></span> Resources</a>

      <a data-view="errors"><span class="ic"><svg viewBox="0 0 256 256"><path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z"/></svg></span> Errors</a>
    </nav>
    <!-- Four unlabelled numbers in 10px mono used to live here: "freshness
         19.9s", "classified 92%", a bare timestamp and two lowercase buttons.
         Every one of them was jargon or an abbreviation of jargon, and none
         said what it was for. Now: one status line about whether the page is
         live, two LABELLED metrics that explain themselves on hover, and the
         account action set apart from both. -->
    <div class="side-foot">
      <div class="foot-status">
        <span class="live-dot" id="live-dot"></span>
        <span id="foot-updated">Loading…</span>
        <button id="refresh-now" type="button" title="Fetch the latest data now">
          Refresh
        </button>
      </div>

      <dl class="foot-stats">
        <div title="How long a span takes to travel from happening in your server to being queryable here. Under a minute is healthy.">
          <dt>Ingest lag</dt><dd id="foot-fresh">—</dd>
        </div>
        <div title="Share of failures classified precisely, rather than reported as a generic tool error. Below 100% means some of your servers are not running the mcpobs helper.">
          <dt>Error detail</dt><dd id="foot-class">—</dd>
        </div>
      </dl>

      <!-- Sign out clears the key from localStorage. Present because a shared
           machine is the normal case for an ops console. -->
      <button id="sign-out" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h2 id="title">Overview</h2>
      <div class="spacer"></div>
      <div class="range" id="range">
        <button data-m="15">15m</button>
        <button data-m="60" class="on">1h</button>
        <button data-m="360">6h</button>
        <button data-m="1440">24h</button>
        <button data-m="10080">7d</button>
      </div>
    </header>
    <!-- The filter bar lives OUTSIDE #content deliberately. render() replaces
         the whole of #content, so a search box inside it would be destroyed and
         rebuilt on every keystroke -- losing focus and the caret mid-word. Here
         it survives every list redraw, including the 30s auto-refresh. -->
    <div class="filters" id="filters"></div>
    <div class="content" id="content"><div class="spin">Loading…</div></div>
  </main>
</div>

<!-- The trace drawer. Slides in from the right OVER the list rather than
     replacing it: debugging is comparison, and navigating away loses the list
     you were working through. -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <button class="dr-close" id="drawer-close" title="Close (Esc)"><svg viewBox="0 0 256 256"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
