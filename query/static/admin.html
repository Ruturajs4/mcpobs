<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mcpobs · operator</title>
  <link rel="preload" href="/static/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/jetbrains-mono-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <!-- The banner is not decoration. This page shows EVERY tenant, and an
         operator with two console tabs open needs to know at a glance which one
         they are typing into. -->
    <div class="brand admin-brand">
      <h1>Operator</h1>
      <div class="sub mono">cross-tenant · admin scope</div>
    </div>
    <nav>
      <div class="grp">Fleet</div>
      <a data-view="tenants" class="on"><span class="ic">▦</span> Tenants</a>
      <a data-view="pipeline"><span class="ic">◈</span> Pipeline</a>
      <div class="grp">Access</div>
      <a data-view="keys"><span class="ic">⚿</span> API keys</a>
      <a data-view="invites"><span class="ic">✉</span> Invites</a>
      <a data-view="audit"><span class="ic">⎘</span> Audit</a>
    </nav>
    <!-- Same shape as the customer console footer: labelled stats that explain
         themselves on hover, then the account actions set apart from them. -->
    <div class="side-foot">
      <dl class="foot-stats">
        <div title="Spans accepted across all tenants in the last 15 minutes. Zero means nothing is being ingested.">
          <dt>Ingested</dt><dd id="foot-spans">—</dd>
        </div>
        <div title="How long a span takes to travel from happening in a customer's server to being queryable here. Under a minute is healthy.">
          <dt>Ingest lag</dt><dd id="foot-fresh">—</dd>
        </div>
      </dl>

      <div class="foot-actions">
        <a href="/" class="link-out">Customer console →</a>
        <button id="sign-out" type="button">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h2 id="title">Tenants</h2>
      <div class="range" id="range">
        <button data-m="60">1h</button>
        <button data-m="1440" class="on">24h</button>
        <button data-m="10080">7d</button>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<script src="/static/admin.js"></script>
</body>
</html>
