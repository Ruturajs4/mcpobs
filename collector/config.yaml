# Collector gateway -- the production ingress (Architecture.md ADR-003).
# It authenticates, stamps trusted tenant metadata, batches, and produces to
# Kafka. It performs NO analytics and never touches ClickHouse.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # Production resolves these from the authenticated API key and OVERWRITES
  # whatever the customer sent, so a tenant cannot write into another tenant.
  # Locally they are hard-coded.
  #
  # MUST be `resource`, not `attributes`: the attributes processor writes SPAN
  # attributes, so tenant.id never reached the Resource and the normalizer --
  # which reads tenancy from the Resource per V2 §8.3 -- silently fell back to
  # its "local" default. With real tenants that collapses every customer into
  # one. Caught by tests/test_otlp_decode.py.
  resource/tenant:
    attributes:
      - { key: tenant.id, value: local, action: upsert }
      - { key: project.id, value: local, action: upsert }
      - { key: data.region, value: local, action: upsert }

  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 2048

exporters:
  kafka:
    brokers: [kafka:9092]
    topic: otlp.spans.raw
    encoding: otlp_proto          # never transcode to JSON
    # ADR-004: partition by tenant, NOT by trace. Keying by trace would explode
    # every OTLP batch into per-trace messages.
    partition_traces_by_id: false
    producer:
      required_acks: -1           # acks=all -- THE ack boundary (ADR-008)
      compression: zstd
      max_message_bytes: 10000000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
    sending_queue:
      enabled: true
      queue_size: 1000

  debug:
    verbosity: normal             # raise to `detailed` for T3-style inspection

  # Self-telemetry sink. Prometheus rather than another storage system: these
  # are OUR operational metrics, and the point of separating them from the
  # traces pipeline is that an outage which breaks ingestion must not also
  # blind us to it (V2 §19).
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, batch]
      exporters: [kafka, debug]

    # SEPARATE from traces on purpose. Our own metrics never touch Kafka, never
    # touch a customer tenant, and survive a ClickHouse or Kafka outage -- which
    # is exactly when we need them most.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
